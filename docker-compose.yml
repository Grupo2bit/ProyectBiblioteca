version: "3.8"

services:
  backend:
    build: ./back
    container_name: backend
    ports:
      - "3001:3000"
    networks:
      - app-network

  front:
    build: ./front
    container_name: frontend
    ports:
      - "4200:80"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge