server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.csr.html;

  # estáticos
  location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|css|js|map)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: si la ruta no existe, sirve el CSR
  location / {
    try_files $uri $uri/ /index.csr.html;
  }
}
